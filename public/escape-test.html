<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>逃脫測試 · Seven Hand Poker</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, "Noto Sans TC", system-ui, sans-serif;
    background: #1c1a17; color: #f4ecdd; line-height: 1.6;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .card { background: #2a2622; border: 1px solid #4a4038; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .k { color: #b7a789; font-size: 12px; }
  .v { font-weight: 700; word-break: break-all; }
  .env { font-size: 22px; font-weight: 800; }
  .ok { color: #6fe08a; }
  .warn { color: #ffd23e; }
  button {
    display: block; width: 100%; margin: 10px 0; padding: 15px;
    font-size: 17px; font-weight: 800; border: none; border-radius: 12px;
    background: linear-gradient(180deg,#e6b34d,#c98a24); color: #2a1c06; cursor: pointer;
  }
  button.sec { background: #3a332b; color: #f4ecdd; border: 1px solid #5a4e42; }
  small { color: #b7a789; }
  ol { padding-left: 20px; }
  code { background: #000; padding: 1px 5px; border-radius: 5px; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
  <h1>🧭 逃脫測試</h1>

  <div class="card">
    <div class="k">目前偵測到的環境</div>
    <div class="env" id="env">偵測中…</div>
    <div id="verdict" style="margin-top:6px;"></div>
  </div>

  <div class="card">
    <div class="k">User-Agent</div>
    <div class="v" id="ua"></div>
  </div>

  <p><b>測試步驟:</b>把這一頁的網址用 FB / LINE 傳給自己 → 在手機的 FB / LINE 裡打開它 → 按下面的按鈕,看會不會跳到 Safari / Chrome。</p>

  <button id="btnSmart">① 智慧跳轉(自動選 iOS / 安卓 方式)</button>
  <button class="sec" id="btnSafari">② 手動:x-safari-https(iOS 開 Safari)</button>
  <button class="sec" id="btnIntent">③ 手動:intent://(安卓開 Chrome)</button>
  <button class="sec" id="btnLine">④ 手動:openExternalBrowser 重載(LINE)</button>

  <p><small>成功的判斷:按下後如果跳到 Safari/Chrome,這一頁會在真瀏覽器重新打開,上面「環境」會變成 <span class="ok">真瀏覽器</span>。若沒反應=該方法在你這台失效(換下一顆試)。</small></p>

  <div class="card">
    <div class="k">要分享的測試網址(複製這條傳到 FB / LINE)</div>
    <div class="v" id="shareUrl"></div>
    <button class="sec" id="btnCopy" style="margin-top:10px;">複製網址</button>
  </div>

<script>
(function () {
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  var app = 'unknown';
  if (/FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua)) app = 'Facebook / Messenger';
  else if (/Instagram/i.test(ua)) app = 'Instagram';
  else if (/\bLine\//i.test(ua)) app = 'LINE';
  else if (/MicroMessenger/i.test(ua)) app = 'WeChat';
  else app = 'browser';

  var isInApp = app !== 'browser';
  var os = isIOS ? 'iOS' : (isAndroid ? 'Android' : '桌機/其他');

  document.getElementById('ua').textContent = ua;
  var envEl = document.getElementById('env');
  var verdict = document.getElementById('verdict');
  if (isInApp) {
    envEl.innerHTML = '<span class="warn">' + app + ' 內建瀏覽器</span> · ' + os;
    verdict.innerHTML = '<small>你現在在 App 的 webview 裡。按按鈕試逃脫。</small>';
  } else {
    envEl.innerHTML = '<span class="ok">真瀏覽器</span> · ' + os;
    verdict.innerHTML = '<small class="ok">✓ 已經在真瀏覽器(如果你剛剛是從 App 按按鈕跳過來的 → 代表逃脫成功!)</small>';
  }

  // Build escape targets from the CURRENT url (so it re-opens this same test page).
  var base = location.host + location.pathname;                 // e.g. ricky.github.io/SevenHandPoker/escape-test.html
  var httpsUrl = 'https://' + base;
  var xsafari  = 'x-safari-https://' + base;
  var intent   = 'intent://' + base + '#Intent;scheme=https;end';
  var lineUrl  = httpsUrl + '?openExternalBrowser=1&t=' + Date.now();

  var shareUrl = httpsUrl + '?openExternalBrowser=1';
  document.getElementById('shareUrl').textContent = shareUrl;

  function go(url) { try { window.location.href = url; } catch (e) { alert('失敗:' + e); } }

  document.getElementById('btnSafari').onclick = function () { go(xsafari); };
  document.getElementById('btnIntent').onclick = function () { go(intent); };
  document.getElementById('btnLine').onclick   = function () { go(lineUrl); };
  document.getElementById('btnSmart').onclick  = function () {
    if (isAndroid) go(intent);
    else if (isIOS) go(xsafari);
    else alert('這台是桌機/其他,不需要逃脫。');
  };
  document.getElementById('btnCopy').onclick = function () {
    navigator.clipboard && navigator.clipboard.writeText(shareUrl).then(
      function () { document.getElementById('btnCopy').textContent = '已複製 ✓'; },
      function () { prompt('手動複製:', shareUrl); }
    );
  };
})();
</script>
</body>
</html>
